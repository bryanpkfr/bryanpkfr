<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages: Redirigir a index.html para que React Router maneje las rutas
      var repoName = 'bryanpkfr';
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      
      // Prevenir bucle infinito: verificar si ya estamos en index.html
      if (path.includes('/index.html')) {
        // Ya estamos en index.html, no redirigir
        return;
      }
      
      // Extraer la ruta relativa al repositorio
      var repoPath = '/' + repoName;
      var relativePath = path;
      
      if (path.startsWith(repoPath)) {
        relativePath = path.substring(repoPath.length);
      }
      
      // Asegurar que empiece con /
      if (relativePath === '' || relativePath === '/') {
        relativePath = '/';
      } else if (!relativePath.startsWith('/')) {
        relativePath = '/' + relativePath;
      }
      
      // Redirigir a index.html (React Router con basename manejará la ruta)
      var targetUrl = repoPath + '/index.html' + relativePath + search + hash;
      
      // Solo redirigir si es diferente a la URL actual
      if (targetUrl !== window.location.pathname + search + hash) {
        window.location.replace(targetUrl);
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
